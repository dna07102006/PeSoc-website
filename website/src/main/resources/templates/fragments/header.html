<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PéSoc</title>
    <link rel="icon" type="image/x-icon" th:href="@{/favicon.ico}">
    
    <link rel="apple-touch-icon" href="/favicon192.png">
    
    <link rel="manifest" href="/manifest.json">
    
    <meta name="theme-color" content="#1a1a1a">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        /* ĐẨY NỘI DUNG XUỐNG NHƯỜNG CHỖ CHO HEADER */
        body { padding-top: 75px !important; }

        /* ĐÃ FIX: Xóa position: relative; để fixed-top hoạt động */
        .navbar-custom { background-color: #1a1a1a !important; border-bottom: 1px solid #222; padding: 15px 0; z-index: 1050; }
        .nav-link { font-weight: 500; color: #ffffff !important; font-size: 1rem; }
        .nav-link:hover { color: #ffc107 !important; }
        
        /* Ô TÌM KIẾM QUICK SEARCH */
        .search-wrapper { position: relative; width: 280px; }
        .search-container { 
            background-color: rgba(255, 255, 255, 0.1); 
            border-radius: 50px; 
            padding: 6px 18px; 
            display: flex; 
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.3s ease; 
        }
        
        /* Hiệu ứng khi di chuột hoặc click vào ô tìm kiếm */
        .search-container:hover, .search-container:focus-within {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 193, 7, 0.3); 
        }

        .search-input { 
            background: transparent !important; 
            border: none !important; 
            color: #ffffff !important; 
            box-shadow: none !important; 
            font-size: 0.9rem; 
            width: 100%; 
        }
        
        /* LÀM SÁNG CHỮ TÌM KIẾM (Placeholder) */
        .search-input::placeholder { 
            color: #dddddd !important; 
            opacity: 1; 
        }
        
        #search-results { 
            position: absolute; top: 115%; left: 0; width: 100%; background-color: #1e1e1e; 
            border: 1px solid #333; border-radius: 12px; display: none; z-index: 9999; 
            /* THÊM 3 DÒNG NÀY ĐỂ TẠO THANH CUỘN */
            max-height: 400px; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* LÀM ĐẸP THANH CUỘN (SCROLLBAR) CHO BOX TÌM KIẾM */
        #search-results::-webkit-scrollbar {
            width: 6px;
        }
        #search-results::-webkit-scrollbar-track {
            background: transparent; 
        }
        #search-results::-webkit-scrollbar-thumb {
            background: #555; 
            border-radius: 10px;
        }
        #search-results::-webkit-scrollbar-thumb:hover {
            background: #888; 
        }
        /* KHUNG ẢNH TRONG Ô TÌM KIẾM */
        .search-avatar-box { 
            width: 28px; height: 28px; min-width: 28px; border-radius: 50%; 
            border: 1px solid #444; overflow: hidden; display: flex; 
            align-items: center; justify-content: center; background-color: #000; margin-right: 12px;
        }
        .search-avatar-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .search-tour-box { 
            width: 32px; height: 32px; min-width: 32px; border-radius: 6px; 
            border: 1px solid #444; overflow: hidden; display: flex; 
            align-items: center; justify-content: center; background-color: #000; margin-right: 12px;
        }
        .search-tour-box img { width: 100%; height: 100%; object-fit: contain; }

        .result-group { border-bottom: 1px solid #222; padding: 5px 0; }
        .result-group:last-child { border-bottom: none; } 
        .result-title { font-size: 0.65rem; color: #ffc107; font-weight: 800; padding: 8px 15px 2px; text-transform: uppercase; }
        .result-item { display: flex; align-items: center; padding: 10px 15px; color: #fff; text-decoration: none !important; }
        .result-item:hover { background-color: #252525; color: #ffc107 !important; }

        /* PESOCTOK NAV LINK */
        .pesoctok-nav-link { color: #fff !important; text-decoration: none; }
        .pesoctok-nav-link:hover { opacity: 0.85; }

        /* Icon TikTok (fa-brands fa-tiktok) — hiệu ứng 3 lớp màu */
        .pesoctok-icon {
            font-size: 1.25rem;
            color: #ffffff;
            filter:
                drop-shadow(-2.5px -2px 0px #69C9D0)
                drop-shadow(2.5px  2px  0px #EE1D52);
            transition: filter 0.2s;
        }
        .pesoctok-nav-link:hover .pesoctok-icon {
            filter:
                drop-shadow(-3px -2.5px 0px #69C9D0)
                drop-shadow(3px   2.5px 0px #EE1D52);
        }

        /* Chữ PeSocTok — 3 màu bằng text-shadow */
        .pesoctok-nav-text {
            font-weight: 800;
            font-size: 1rem;
            color: #ffffff;
            text-shadow:
                -2px -1.5px 0 #69C9D0,
                 2px  1.5px 0 #EE1D52;
        }
        .pesoctok-nav-link:hover .pesoctok-nav-text {
            text-shadow:
                -2.5px -2px 0 #69C9D0,
                 2.5px  2px 0 #EE1D52;
        }

        /* AUTH SECTION */
        .auth-wrapper { display: flex; align-items: center; border-left: 1px solid rgba(255, 255, 255, 0.15); padding-left: 20px; margin-left: 15px; }
        .btn-logout { color: #888 !important; text-decoration: none; font-size: 0.8rem; margin-left: 15px; transition: 0.3s; }
        .btn-logout:hover { color: #dc3545 !important; }

        /* ========================================================
           📱 GIAO DIỆN ĐIỆN THOẠI (MOBILE RESPONSIVE PATCH V2.0)
           ======================================================== */
        @media (max-width: 991px) {
            /* Thanh Header */
            .search-wrapper { width: 100% !important; margin: 15px 0 10px 0 !important; }
            .auth-wrapper { border-left: none !important; padding-left: 0 !important; margin-left: 0 !important; margin-top: 15px; justify-content: center; }
        }

        @media (max-width: 768px) {
            /* --- 1. ÉP MATCH ROW CHUẨN FOTMOB (Cho Home, Lịch sử, Sắp tới) --- */
            .match-item, .match-row { 
                display: flex !important; 
                flex-wrap: wrap !important; 
                padding: 12px 10px 15px 10px !important; 
                align-items: center;
            }
            
            /* Dòng 1: Đưa Ngày và Giải đấu lên trên cùng, chia đôi 50/50 */
            .match-date-col, .m-date { 
                order: 1; 
                width: 50% !important; 
                text-align: left !important; 
                margin-bottom: 10px; 
                font-weight: 600; 
                color: #888; 
                border: none !important; /* Xóa mọi đường kẻ */
            }
            .match-tour-col, .m-tour-col { 
                order: 2; 
                width: 50% !important; 
                text-align: right !important; 
                margin-bottom: 10px; 
                margin-top: 0 !important;
                color: #aaa; 
            }
            
            /* Dòng 2: Nội dung chính trận đấu (Chứa người chơi và tỉ số) */
            .match-main-col, .m-main-col { 
                order: 3; 
                width: 100% !important; 
                display: flex !important; 
                align-items: center !important; 
                border-top: none !important; /* 🌟 Đã xóa vạch gạch chấm theo ý sếp */
                padding-top: 0 !important;
            }

            /* 🌟 MA THUẬT: Cân bằng 2 tên người chơi, ép cắt chữ (ellipsis) nếu quá dài để không lệch tỉ số */
            .match-main-col .player-name, .m-main-col .m-player-name { 
                flex: 1; 
                width: 0 !important; 
                max-width: none !important; 
                white-space: nowrap; 
                overflow: hidden; 
                text-overflow: ellipsis; 
                font-size: 0.9rem !important; 
            }
            /* Đẩy lề 2 bên ra 1 chút để không dính vào Avatar */
            .match-main-col .player-name.text-end, .m-main-col .m-player-name.text-end { padding-right: 8px; }
            .match-main-col .player-name:not(.text-end), .m-main-col .m-player-name:not(.text-end) { padding-left: 8px; }
            
            /* Giữ chặt cục tỉ số/VS ở giữa không bị bóp méo */
            .score-box { flex-shrink: 0; min-width: 110px; }

            /* Fix riêng trang Chi tiết Giải */
            #tab-matches .m-date { width: 100% !important; text-align: center !important; margin-bottom: 12px !important; padding-bottom: 0 !important; }
            
            /* ... (Giữ nguyên các khối số 2, 3, 4 bên dưới của sếp nhé) ... */

            /* --- 2. BẢNG XẾP HẠNG (BXH ELO & BXH GIẢI ĐẤU) CÓ THANH CUỘN --- */
            .table-responsive { overflow-x: auto !important; -webkit-overflow-scrolling: touch; border: none !important; }
            .table-elo, .table-ranking { min-width: 600px; /* Ép độ rộng tối thiểu để vuốt ngang, không bị dúm chữ */ }
            
            /* --- 3. FIX TRANG CHI TIẾT GIẢI ĐẤU (TOURNAMENT DETAIL) --- */
            .td-banner { justify-content: center !important; text-align: center; }
            .td-avatar-wrapper { margin: 0 auto; }
            .td-meta { justify-content: center; }
            
            /* Vuốt ngang các Tab menu thay vì ép rớt dòng */
            .nav-tabs-chess { flex-wrap: nowrap !important; overflow-x: auto !important; overflow-y: hidden; justify-content: flex-start !important; }
            .nav-tabs-chess .nav-link { white-space: nowrap; flex-shrink: 0; }
            .nav-tabs-chess::-webkit-scrollbar { height: 0px; } /* Giấu scrollbar đi cho đẹp gọn */

            /* --- 4. CÁC TINH CHỈNH PROFILE & NEWS KHÁC --- */
            .stats-row { flex-wrap: wrap; }
            .stat-card { flex: 0 0 50%; border-bottom: 1px solid #2d2d2d; }
            .stat-card:nth-child(even) { border-right: none; }
            .stat-card:nth-child(3), .stat-card:nth-child(4) { border-bottom: none; }
            
            .hero-main { height: 280px !important; }
            .hero-title { font-size: 1.3rem !important; }
            .li-thumb { width: 90px !important; height: 65px !important; }
            .article-title { font-size: 1.8rem !important; } /* Cân đối lại tiêu đề bài báo */
            
            .adv2-info-box .col-6 { width: 100% !important; }

            /* =========================================
               🌟 5. FIX TRÀN VIỀN HỘP THÔNG BÁO MOBILE (CHUẨN 100%)
               ========================================= */
            #inapp-notification-center .dropdown-menu {
                position: fixed !important; /* Dùng Fixed để tách hẳn ra khỏi thanh Header */
                top: 65px !important; /* Căn nằm ngay dưới viền Header */
                left: 50% !important; 
                transform: translateX(-50%) !important; /* Bùa chú ép ra chính giữa màn hình tuyệt đối */
                width: 94vw !important; /* Rộng 94% màn hình */
                max-width: 400px !important;
                margin-top: 0 !important;
                border-radius: 12px !important;
            }

            /* =========================================
               🌟 6. FIX TRANG CHI TIẾT TRẬN ĐẤU (MATCH DETAIL)
               ========================================= */
            .match-main-info { 
                flex-wrap: nowrap !important; /* 🌟 CẤM RỚT DÒNG toàn bộ khu vực này */
                gap: 5px !important; /* Thu hẹp khoảng cách để nhường chỗ cho tỉ số */
            }
            
            /* Thu nhỏ Avatar lại 1 xíu */
            .player-avatar { width: 50px !important; height: 50px !important; }
            .player-avatar i { font-size: 2rem !important; }
            
            /* Ép khu vực chứa tỉ số thành 1 hàng ngang bất tử */
            .match-main-info .text-center {
                white-space: nowrap !important; 
                flex-shrink: 0; /* Không cho phép bóp méo khu vực giữa */
                min-width: 80px; 
            }
            
            .score-val { 
                font-size: 2rem !important; /* Thu nhỏ số lại 1 chút xíu */
                white-space: nowrap !important; 
                display: inline-block;
            }
            
            .player-name, .team-name { font-size: 0.9rem !important; }
            
            /* Căn lại thanh Tab "Đội hình / Thành tích" cho nó khỏi chen lấn */
            .nav-tabs .nav-link { font-size: 0.85rem !important; padding: 10px 5px !important; }
            .nav-tabs { flex-wrap: nowrap; justify-content: center; }
        }
    </style>
</head>
<body>
    <div th:fragment="navbar">
        <nav class="navbar navbar-expand-lg navbar-dark navbar-custom fixed-top">
            <div class="container">
                <a class="navbar-brand fw-bold fs-3" th:href="@{/home}">PESOC</a>
               
                <div class="d-flex align-items-center ms-auto order-lg-last">
                    
                    <div class="auth-wrapper d-flex align-items-center me-2 me-lg-0" style="border-left: none; padding-left: 0; margin-left: 0;">
                        <th:block th:if="${session.logInUser == null}">
                             <button type="button" class="btn btn-light rounded-pill px-3 px-lg-4 fw-bold" style="font-size: 0.85rem;" data-bs-toggle="modal" data-bs-target="#loginModal">
                                 Đăng nhập
                             </button>
                        </th:block>

                        <th:block th:if="${session.logInUser != null}">
                            <a th:if="${session.logInUser.role == 'ADMIN'}" th:href="@{/admin}" 
                            class="btn btn-danger d-flex align-items-center justify-content-center me-3 shadow-sm" 
                            title="Quản trị hệ thống" 
                            style="width: 35px; height: 35px; border-radius: 50%; padding: 0; transition: 0.2s;">
                                <i class="fas fa-cog"></i>
                            </a>
                            
                            <a th:href="@{'/profile/' + ${session.logInUser.username}}" class="d-flex align-items-center text-white fw-bold text-decoration-none">
                                <img th:if="${session.logInUser.avatar != null}" 
                                     th:src="@{'/uploads/avatars/' + ${session.logInUser.avatar}}" 
                                     class="rounded-circle shadow-sm" 
                                     style="width: 35px; height: 35px; object-fit: cover; border: 1px solid #444;" 
                                     alt="Avatar">
                                     
                                <div th:if="${session.logInUser.avatar == null}" 
                                     class="rounded-circle d-flex align-items-center justify-content-center shadow-sm" 
                                     style="width: 35px; height: 35px; background-color: #000; border: 1px solid #444;">
                                     <i class="fas fa-user text-secondary" style="font-size: 0.9rem;"></i>
                                </div>
                                <span class="ms-2 d-none d-sm-inline" th:text="${session.logInUser.username}"></span>
                            </a>

                            <div class="d-flex flex-row align-items-center justify-content-center ms-2 ms-md-3" id="icon-column" style="gap: 12px; margin-top: 0;">
                            
                                <div class="dropdown d-flex justify-content-center" id="inapp-notification-center" style="width: 24px; height: 20px; align-items: center;">
                                    <a class="text-secondary position-relative d-flex justify-content-center align-items-center w-100 h-100" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false" style="font-size: 1.1rem; text-decoration: none; transition: 0.2s;" onmouseover="this.classList.remove('text-secondary'); this.classList.add('text-white');" onmouseout="this.classList.remove('text-white'); this.classList.add('text-secondary');">
                                        <i class="fas fa-bell"></i>
                                        <span id="notif-badge" class="position-absolute badge rounded-pill bg-danger border border-dark shadow-sm" style="font-size: 0.55rem; top: -6px; right: -8px; display: none; padding: 0.25em 0.4em;">0</span>
                                    </a>

                                    <ul class="dropdown-menu dropdown-menu-end p-0 shadow-lg" style="width: 350px; max-width: 90vw; background-color: #222; border: 1px solid #444; border-radius: 12px; max-height: 450px; overflow-y: auto; overflow-x: hidden; margin-top: 15px;">
                                        <li class="p-3 text-white fw-bold border-bottom border-dark d-flex justify-content-between align-items-center sticky-top" style="background: #222; z-index: 10;">
                                            <span class="fs-6">Thông báo</span>
                                            <a href="#" onclick="markAllAsRead(event)" class="text-fm-green" style="font-size: 0.8rem; text-decoration: none;"><i class="fas fa-check-double"></i> Đánh dấu đã đọc</a>
                                        </li>
                                        <div id="notif-list-container">
                                            <div id="empty-notif-msg" class="text-muted text-center py-4 fst-italic" style="font-size: 0.85rem;">Bạn chưa có thông báo nào.</div>
                                        </div>
                                    </ul>
                                </div>

                                <a id="nav-push-bell" href="#" class="justify-content-center align-items-center" style="font-size: 1.05rem; text-decoration: none; width: 24px; height: 20px; display: none !important; transition: 0.2s;">
                                </a>

                                <a th:href="@{/logout}" class="btn-logout text-secondary d-flex justify-content-center align-items-center" title="Đăng xuất" style="font-size: 1.1rem; text-decoration: none; width: 24px; height: 20px; margin: 0 !important; padding: 0 !important; transition: 0.2s;" onmouseover="this.classList.remove('text-secondary'); this.classList.add('text-white');" onmouseout="this.classList.remove('text-white'); this.classList.add('text-secondary');">
                                    <i class="fas fa-sign-out-alt"></i>
                                </a>
                            </div>
                        </th:block>
                    </div>

                    <button class="navbar-toggler ms-2" type="button" data-bs-toggle="collapse" data-bs-target="#pesocNavbar" aria-controls="pesocNavbar" aria-expanded="false" aria-label="Toggle navigation" style="border: 1px solid #333; box-shadow: none; padding: 4px 8px;">
                        <span class="navbar-toggler-icon" style="width: 1.2em; height: 1.2em;"></span>
                    </button>
                </div>

                <div class="collapse navbar-collapse" id="pesocNavbar">
                    <div class="search-wrapper ms-lg-4 mt-3 mt-lg-0">
                        <div class="search-container">
                            <i class="fas fa-search text-secondary"></i>
                            <input class="form-control search-input" type="text" id="quick-search" placeholder="Tìm kiếm tài khoản, giải đấu, #hashtag..." autocomplete="off">
                        </div>
                        <div id="search-results"></div>
                    </div>
                    
                    <ul class="navbar-nav flex-lg-grow-1 justify-content-lg-evenly gap-2 mt-3 mt-lg-0">
                        <li class="nav-item"><a class="nav-link" th:href="@{/elo-board}">BXH Elo</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/upcoming-matches}">Lịch thi đấu</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/tournaments}">Giải đấu</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/news}">Tin tức</a></li>
                        <li class="nav-item">
                            <a class="nav-link fw-bold d-flex align-items-center gap-1 pesoctok-nav-link" th:href="@{/pesoctok}">
                                <i class="fa-brands fa-tiktok pesoctok-icon"></i>
                                <span class="pesoctok-nav-text">PeSocTok</span>
                            </a>
                        </li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/about-us}">Về chúng tôi</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <div th:if="${message}" class="container mt-4 mb-2">
            <div class="alert alert-dismissible fade show text-white fw-bold shadow-sm" 
                 th:style="${#strings.contains(message, 'Lỗi')} ? 'background-color: #2c1619; border: 1px solid #dc3545;' : 'background-color: #14281d; border: 1px solid #198754;'" 
                 role="alert" style="border-radius: 10px;">
                
                <i class="fas me-2" th:classappend="${#strings.contains(message, 'Lỗi')} ? 'fa-exclamation-triangle text-danger' : 'fa-check-circle text-success'"></i>
                <span th:text="${message}"></span>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert" aria-label="Close" style="box-shadow: none;"></button>
            </div>
        </div>

        <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="background-color: #1a1a1a; border: 1px solid #333; border-radius: 16px;">
                    <div class="modal-header border-0 pb-0">
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body p-4 pt-0 text-center">
                        <h4 class="fw-bold text-white mb-4">Đăng nhập</h4>
                        <form th:action="@{/login}" method="post" class="text-start">
                            <div class="mb-3">
                                <label class="form-label text-secondary small fw-bold">TÊN ĐĂNG NHẬP</label>
                                <input type="text" name="username" class="form-control" style="background-color: #000; border: 1px solid #333; color: #fff;" required>
                            </div>
                            <div class="mb-3"> <label class="form-label text-secondary small fw-bold">MẬT KHẨU</label>
                                <input type="password" name="password" class="form-control" style="background-color: #000; border: 1px solid #333; color: #fff;" required>
                            </div>
                            
                            <div class="form-check mb-4 d-flex align-items-center">
                                <input class="form-check-input mt-0" type="checkbox" name="remember-me" id="rememberMe" style="background-color: #000; border-color: #555; cursor: pointer;">
                                <label class="form-check-label text-secondary small fw-bold ms-2" for="rememberMe" style="cursor: pointer; padding-top: 2px;">
                                    GHI NHỚ ĐĂNG NHẬP
                                </label>
                            </div>
                            
                            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 rounded-pill">ĐĂNG NHẬP</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <script>
            const searchInput = document.getElementById('quick-search');
            const resultsBox = document.getElementById('search-results');

            document.addEventListener('click', function(e) {
                if (!searchInput.contains(e.target) && !resultsBox.contains(e.target)) {
                    resultsBox.style.display = 'none';
                }
            });

            searchInput.addEventListener('input', function() {
                let keyword = this.value.trim().replace('#', '');
                
                if (keyword.length < 1) { 
                    resultsBox.style.display = 'none'; 
                    return; 
                }

                fetch(`/api/search?keyword=${encodeURIComponent(keyword)}`)
                    .then(res => res.json())
                    .then(data => {
                        let html = '';
                        let hasData = false;

                        if (data.tags && data.tags.length > 0) {
                            hasData = true;
                            html += '<div class="result-group"><div class="result-title text-info">Chủ đề (Hashtag)</div>';
                            data.tags.forEach(t => {
                                let tagName = typeof t === 'string' ? t : t.name;
                                html += `<a href="/news/tag/${tagName}" class="result-item">
                                            <i class="fas fa-hashtag text-info me-2"></i> ${tagName}
                                        </a>`;
                            });
                            html += '</div>';
                        }

                        // ... (giữ nguyên phần hashtag)

                        // 1. RENDER KẾT QUẢ NGƯỜI CHƠI (CÓ AVATAR)
                        if (data.users && data.users.length > 0) {
                            hasData = true;
                            html += '<div class="result-group"><div class="result-title">Người chơi</div>';
                            data.users.forEach(u => {
                                // Kiểm tra xem user có avatar không
                                let avatarHtml = u.avatar 
                                    ? `<img src="/uploads/avatars/${u.avatar}">`
                                    : `<i class="fas fa-user text-secondary" style="font-size: 0.8rem;"></i>`;
                                    
                                html += `<a href="/profile/${u.username}" class="result-item">
                                            <div class="search-avatar-box">${avatarHtml}</div>
                                            ${u.username}
                                        </a>`;
                            });
                            html += '</div>';
                        }

                        // 2. RENDER KẾT QUẢ GIẢI ĐẤU (CÓ BANNER)
                        if (data.tournaments && data.tournaments.length > 0) {
                            hasData = true;
                            html += '<div class="result-group"><div class="result-title">Giải đấu</div>';
                            data.tournaments.forEach(t => {
                                // Kiểm tra xem giải đấu có banner không
                                let bannerHtml = t.banner 
                                    ? `<img src="/uploads/tournaments/${t.banner}">`
                                    : `<i class="fas fa-trophy text-warning" style="font-size: 1rem;"></i>`;
                                    
                                html += `<a href="/tournament-detail/${t.name}" class="result-item">
                                            <div class="search-tour-box">${bannerHtml}</div>
                                            ${t.name}
                                        </a>`;
                            });
                            html += '</div>';
                        }
                        
                        // ... (giữ nguyên phần if(hasData) bên dưới)

                        if (hasData) {
                            resultsBox.innerHTML = html;
                            resultsBox.style.display = 'block';
                        } else {
                            resultsBox.innerHTML = '<div class="p-3 text-secondary small text-center"><i class="fas fa-search me-2"></i>Không tìm thấy kết quả...</div>';
                            resultsBox.style.display = 'block';
                        }
                    })
                    .catch(err => console.error("Search error:", err));
            });
        </script>
    </div>

    <div th:fragment="scripts">
        <div id="pesoc-auth-status" th:data-logged-in="${session.logInUser != null}" style="display:none;"></div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
        
        <style>
            .bg-unread-notif { background-color: #2c2c2c !important; border-left: 3px solid #ffc107 !important; }
            .bg-read-notif { background-color: transparent !important; border-left: 3px solid transparent !important; }
            #notif-list-container .dropdown-item { transition: all 0.2s ease-in-out !important; }
            #notif-list-container .dropdown-item:hover { background-color: #383838 !important; color: #ffffff !important; }
        </style>

        <script type="module">
            import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
            import { getMessaging, getToken, onMessage, deleteToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

            const firebaseConfig = {
                apiKey: "AIzaSyCR8LKoUZ7JY7hPf7LQsVwF1mS-iCsZd98",
                authDomain: "pesoc-e16d0.firebaseapp.com",
                projectId: "pesoc-e16d0",
                storageBucket: "pesoc-e16d0.firebasestorage.app",
                messagingSenderId: "1009827135409",
                appId: "1:1009827135409:web:5ed31c94785e71b4438790",
                measurementId: "G-4720672Q56"
            };

            const app = initializeApp(firebaseConfig);
            const messaging = getMessaging(app);

            function registerFirebaseToken() {
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('/firebase-messaging-sw.js')
                    .then(registration => navigator.serviceWorker.ready)
                    .then(readyRegistration => {
                        return getToken(messaging, { vapidKey: 'BP1-yHF21w-UXwhiSKbTN8R7l1KrdTFnTdDKqZjWaenq24bR1gXLfqA_-NJ06TNU8GnUIwJFjJQ-Buo3ciXnRRo', serviceWorkerRegistration: readyRegistration });
                    })
                    .then(currentToken => {
                        if (currentToken) {
                            localStorage.setItem('pesoc_fcm_token', currentToken);
                            fetch('/api/notifications/save-token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: currentToken }) });
                        }
                    }).catch(console.error);
                }
            }

            const authStatusDiv = document.getElementById('pesoc-auth-status');
            const isUserLoggedIn = authStatusDiv && authStatusDiv.getAttribute('data-logged-in') === 'true';
            const currentUsername = "[[${session.logInUser != null ? session.logInUser.username : ''}]]";

            if (isUserLoggedIn && currentUsername) {
                const badge = document.getElementById('notif-badge');
                const container = document.getElementById('notif-list-container');
                
                const modalElement = document.getElementById('permissionModal');
                if (modalElement && modalElement.parentNode !== document.body) {
                    document.body.appendChild(modalElement);
                }
                const permModal = new bootstrap.Modal(document.getElementById('permissionModal'));

                function getTimeAgo(dateStr) {
                    if (!dateStr) return "vừa xong";
                    const date = new Date(dateStr);
                    const now = new Date();
                    const diffSec = Math.floor((now - date) / 1000);
                    if (diffSec < 60) return "vừa xong";
                    const diffMin = Math.floor(diffSec / 60);
                    if (diffMin < 60) return diffMin + " phút trước";
                    const diffHour = Math.floor(diffMin / 60);
                    if (diffHour < 24) return diffHour + " giờ trước";
                    const diffDay = Math.floor(diffHour / 24);
                    if (diffDay < 30) return diffDay + " ngày trước";
                    return date.toLocaleDateString('vi-VN');
                }

                function renderNotificationItem(notif, isPrepend = false) {
                    const bgClass = notif.read ? 'bg-read-notif' : 'bg-unread-notif fw-bold';
                    const textStyle = notif.read ? 'color: #aaaaaa;' : 'color: #ffffff;';
                    const timeText = getTimeAgo(notif.createdAt);

                    const itemHtml = `
                        <li class="border-bottom border-dark" style="width: 100%;">
                            <a class="dropdown-item p-3 d-flex flex-column gap-1 text-wrap ${bgClass}" 
                               href="${notif.url}" 
                               onclick="markNotificationAsRead(${notif.id}, event, '${notif.url}', this)"
                               style="${textStyle} font-size: 0.85rem; white-space: normal; word-break: break-word; overflow-wrap: break-word; width: 100%;">
                                <span class="${notif.read ? 'text-secondary' : 'text-warning'}" style="font-size: 0.85rem;"><i class="fas fa-comment-dots me-1"></i> ${notif.title}</span>
                                <span style="line-height: 1.4;">${notif.body}</span>
                                <span class="mt-1" style="color: #a0a0a0; font-size: 0.72rem; font-weight: normal;"><i class="far fa-clock me-1"></i> ${timeText} </span>
                            </a>
                        </li>
                    `;
                    if (isPrepend) { container.insertAdjacentHTML('afterbegin', itemHtml); } 
                    else { container.insertAdjacentHTML('beforeend', itemHtml); }
                }

                fetch('/api/notifications/inbox')
                    .then(res => res.json())
                    .then(data => {
                        if (data.notifications && data.notifications.length > 0) {
                            const emptyMsg = document.getElementById('empty-notif-msg');
                            if (emptyMsg) emptyMsg.remove();
                            data.notifications.forEach(notif => renderNotificationItem(notif, false));
                        }
                        if (data.unreadCount > 0) {
                            badge.innerText = data.unreadCount;
                            badge.style.display = 'inline-block';
                        }
                    }).catch(err => console.error(err));

                const socket = new SockJS('/ws-pesoc');
                const stompClient = Stomp.over(socket);
                stompClient.debug = null;

                stompClient.connect({}, function (frame) {
                    stompClient.subscribe('/topic/notifications/' + currentUsername, function (response) {
                        const newNotif = JSON.parse(response.body);
                        const emptyMsg = document.getElementById('empty-notif-msg');
                        if (emptyMsg) emptyMsg.remove();

                        renderNotificationItem(newNotif, true);
                        let currentCount = parseInt(badge.innerText) || 0;
                        badge.innerText = currentCount + 1;
                        badge.style.display = 'inline-block';
                    });
                });

                // 🌟 ĐÃ FIX: HÀM ĐIỀU KHIỂN LOGIC TÀNG HÌNH ICON 
                function updatePushIconState() {
                    const pushBtn = document.getElementById('nav-push-bell');
                    if (!pushBtn) return;
                    
                    if (Notification.permission === 'granted') {
                        // 1. Đã cấp quyền -> Tàng hình luôn cho gọn
                        pushBtn.style.setProperty('display', 'none', 'important'); 
                    } else {
                        // 2. Chưa cấp hoặc chặn -> Cho hiện lên
                        pushBtn.style.setProperty('display', 'flex', 'important'); 

                        if (Notification.permission === 'denied') {
                            pushBtn.innerHTML = '<i class="fas fa-microphone-slash text-danger"></i>';
                            pushBtn.title = 'Thông báo bị trình duyệt chặn! Click để xem cách mở';
                        } else {
                            pushBtn.innerHTML = '<i class="fas fa-broadcast-tower text-info"></i>';
                            pushBtn.title = 'Cài đặt thông báo ngầm thiết bị';
                        }
                    }
                }
                
                updatePushIconState(); // Chạy ngay lúc load trang

                document.getElementById('nav-push-bell').addEventListener('click', function(e) {
                    e.preventDefault();
                    const titleEl = document.getElementById('modal-perm-title');
                    const bodyEl = document.getElementById('modal-perm-body');
                    const btnAccept = document.getElementById('btn-accept-permission');
                    const btnDeny = document.getElementById('btn-deny-permission');

                    if (Notification.permission === 'denied') {
                        titleEl.innerHTML = 'Trình duyệt đang chặn thông báo 🔒';
                        bodyEl.innerHTML = 'Sếp đã chọn "Chặn" thông báo trên trình duyệt mất rồi.<br><br>Để mở lại, sếp bấm vào <b>biểu tượng ổ khóa 🔒</b> ở góc trên thanh địa chỉ trình duyệt, rồi gạt chọn cấp quyền lại thành <b>"Cho phép" (Allow)</b> nhé sếp!';
                        btnAccept.innerText = 'ĐÃ HIỂU';
                        btnDeny.style.display = 'none';
                    } else {
                        titleEl.innerText = 'Bật thông báo nhé sếp?';
                        bodyEl.innerText = 'Để PéSoc có thể cập nhật lập tức lịch thi đấu và giải đấu mới nhất cho sếp!';
                        btnAccept.innerText = 'CHO PHÉP BẬT THÔNG BÁO';
                        btnDeny.style.display = 'inline-block';
                    }
                    permModal.show();
                });

                if (Notification.permission === 'default') {
                    if (!localStorage.getItem('pesoc_notification_denied')) { permModal.show(); }

                    document.getElementById('btn-accept-permission').addEventListener('click', function() {
                        if (Notification.permission === 'denied') { permModal.hide(); return; }
                        Notification.requestPermission().then((permission) => {
                            permModal.hide();
                            if (permission === 'granted') {
                                updatePushIconState(); // 🌟 Bấm cho phép xong tự biến mất icon
                                registerFirebaseToken();
                            } else if (permission === 'denied') { 
                                updatePushIconState(); // 🌟 Bấm từ chối xong chuyển icon đỏ
                            }
                        });
                    });

                    document.getElementById('btn-deny-permission').addEventListener('click', function() {
                        localStorage.setItem('pesoc_notification_denied', 'true'); permModal.hide();
                    });
                } else if (Notification.permission === 'denied') {
                    document.getElementById('btn-accept-permission').addEventListener('click', function() { permModal.hide(); });
                } else if (Notification.permission === 'granted') {
                    registerFirebaseToken();
                }
            }

            onMessage(messaging, function(payload) {
                let title = "Thông báo mới"; if (payload.notification && payload.notification.title) { title = payload.notification.title; }
                let body = ""; if (payload.notification && payload.notification.body) { body = payload.notification.body; }
                let targetUrl = '/home'; if (payload.data && payload.data.url) { targetUrl = payload.data.url; }
                const options = { body: body, icon: '/favicon192.png', data: { url: targetUrl } };
                if ('serviceWorker' in navigator) { navigator.serviceWorker.ready.then(function(reg) { reg.showNotification(title, options); }); }
            });

            document.addEventListener('DOMContentLoaded', function() {
                const logoutBtn = document.querySelector('.btn-logout');
                if (logoutBtn) {
                    logoutBtn.addEventListener('click', async function(e) {
                        e.preventDefault(); const logoutUrl = this.getAttribute('href'); const currentToken = localStorage.getItem('pesoc_fcm_token');
                        if (currentToken) {
                            try {
                                await deleteToken(messaging); 
                                await fetch('/api/notifications/delete-token', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: currentToken }) });
                            } catch (err) {}
                            localStorage.removeItem('pesoc_fcm_token'); 
                        }
                        localStorage.removeItem('pesoc_notification_denied'); window.location.href = logoutUrl; 
                    });
                }
            });
        </script>

        <script>
            window.markNotificationAsRead = function(id, event, redirectUrl, element) {
                event.preventDefault(); 
                fetch('/api/notifications/mark-read/' + id, { method: 'POST' })
                    .then(() => {
                        const badge = document.getElementById('notif-badge');
                        if (element && element.classList.contains('bg-unread-notif')) {
                            let currentCount = parseInt(badge.innerText) || 0;
                            if (currentCount > 0) {
                                badge.innerText = currentCount - 1;
                                if (currentCount - 1 === 0) badge.style.display = 'none';
                            }
                            element.classList.remove('bg-unread-notif', 'fw-bold');
                            element.classList.add('bg-read-notif');
                            element.style.color = '#aaaaaa';
                            const titleSpan = element.querySelector('.text-warning');
                            if (titleSpan) { titleSpan.classList.remove('text-warning'); titleSpan.classList.add('text-secondary'); }
                        }
                        window.location.href = redirectUrl;
                    })
                    .catch(() => window.location.href = redirectUrl);
            }

            window.markAllAsRead = function(event) {
                event.preventDefault();
                event.stopPropagation(); 
                
                fetch('/api/notifications/mark-all-read', { method: 'POST' })
                    .then(() => {
                        const badge = document.getElementById('notif-badge');
                        badge.innerText = '0';
                        badge.style.display = 'none';
                        
                        document.querySelectorAll('#notif-list-container .bg-unread-notif').forEach(el => {
                            el.classList.remove('bg-unread-notif', 'fw-bold');
                            el.classList.add('bg-read-notif');
                            el.style.color = '#aaaaaa';
                            const titleSpan = el.querySelector('.text-warning');
                            if (titleSpan) { titleSpan.classList.remove('text-warning'); titleSpan.classList.add('text-secondary'); }
                        });
                    })
                    .catch(err => console.error(err));
            }
        </script>

        <div class="modal fade" id="permissionModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="false" style="background-color: rgba(0, 0, 0, 0.8);">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content" style="background-color: #1a1a1a; border: 1px solid #333; border-radius: 16px;">
                    <div class="modal-header border-0 pb-0 d-flex justify-content-end">
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" style="box-shadow: none;"></button>
                    </div>
                    <div class="modal-body p-4 pt-0 text-center">
                        <div class="mb-3">
                            <i class="fas fa-bell text-warning" style="font-size: 3.5rem;"></i>
                        </div>
                        <h4 class="fw-bold text-white mb-3" id="modal-perm-title">Bật thông báo nhé sếp?</h4>
                        <p class="text-secondary mb-4" id="modal-perm-body" style="font-size: 0.95rem;">Để PéSoc có thể cập nhật lập tức lịch thi đấu và giải đấu mới nhất cho sếp!</p>
                        
                        <button id="btn-accept-permission" type="button" class="btn btn-warning w-100 fw-bold py-2 rounded-pill shadow-sm mb-2">CHO PHÉP BẬT THÔNG BÁO</button>
                        <button id="btn-deny-permission" type="button" class="btn btn-outline-secondary w-100 fw-bold py-2 rounded-pill shadow-sm" style="font-size: 0.9rem;">TỪ CHỐI</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
