<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <th:block th:replace="~{fragments/header :: head}"></th:block>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Roboto', sans-serif !important; background-color: #000000; color: #ffffff; margin: 0; }
        .wide-container { max-width: 1000px !important; margin: 0 auto; padding: 20px; }

        :root { --fm-green: #11cd76; }
        .text-fm-green { color: var(--fm-green) !important; }

        /* --- HEADER CARD --- */
        .um-header-card { background-color: #1a1a1a; border-radius: 12px; border: 1px solid #2d2d2d; overflow: hidden; margin-bottom: 20px; padding: 25px 30px; display: flex; align-items: center; justify-content: space-between; }
        .um-title { font-size: 1.6rem; font-weight: 800; margin: 0; color: #fff; text-transform: uppercase; display: flex; align-items: center; gap: 12px; }
        .um-title i { color: #0dcaf0; } 
        .um-subtitle { font-size: 0.9rem; color: #aaa; margin-top: 5px; }

        /* --- INFO BOX --- */
        .info-box { background: #1a1a1a; border-radius: 12px; padding: 10px 0; border: 1px solid #2d2d2d; }

        /* --- MATCH ROW --- */
        .match-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 25px; border-bottom: 1px solid #2d2d2d; text-decoration: none !important; transition: 0.2s; cursor: pointer; }
        .match-row:hover { background: #222; }
        .match-row:last-child { border-bottom: none; }
        
        .m-date { width: 110px; font-size: 0.75rem; color: #bbb; flex-shrink: 0; }
        .m-main-col { flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 15px; }
        
        /* Đã fix lại đoạn hover tên người chơi chuyển vàng */
        .m-player-name { color: #fff; font-size: 0.95rem; font-weight: 600; width: 140px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-decoration: none !important; transition: 0.2s; }
        .m-player-name:hover { color: #ffc107 !important; }
        .m-player-name.left { text-align: right; }
        .m-player-name.right { text-align: left; }

        .score-box { display: flex; align-items: center; flex-direction: column; gap: 4px; min-width: 120px; justify-content: center; }
        .score-main-row { display: flex; align-items: center; gap: 12px; }

        .m-avatar { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #444; overflow: hidden; display: flex; align-items: center; justify-content: center; background-color: #000; }
        .m-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .m-avatar i { font-size: 0.8rem; color: #666; }
        
        /* Đã xóa phông nền xanh của chữ VS, làm giống y hệt trang Profile */
        .vs-badge { color: #0dcaf0; font-size: 0.85rem; text-transform: lowercase; font-weight: 800; margin: 0 10px; }

        .m-tour-col { width: 150px; color: #bbb; font-size: 0.75rem; text-align: right; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* --- PHÂN TRANG (PAGINATION) --- */
        .pagination-container { display: flex; justify-content: center; margin-top: 25px; margin-bottom: 40px; }
        .pagination { display: flex; list-style: none; padding: 0; margin: 0; gap: 8px; }
        .page-item .page-link { background: #1a1a1a; border: 1px solid #333; color: #aaa; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: 0.2s; }
        .page-item .page-link:hover { background: #333; color: #fff; border-color: #555; }
        .page-item.active .page-link { background: var(--fm-green); color: #000; border-color: var(--fm-green); }
        .page-item.disabled .page-link { opacity: 0.3; cursor: not-allowed; pointer-events: none; }

        @media (max-width: 768px) {
            .match-row { padding: 12px 15px; flex-wrap: wrap; }
            .m-date { width: 100%; text-align: center; margin-bottom: 8px; border-bottom: 1px dashed #333; padding-bottom: 5px; }
            .m-tour-col { width: 100%; text-align: center; margin-top: 8px; border-top: 1px dashed #333; padding-top: 5px; }
            .m-player-name { width: 100px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>
    
    <div class="wide-container">
        <div class="um-header-card">
            <div>
                <h1 class="um-title"><i class="fas fa-calendar-alt"></i> Lịch thi đấu sắp tới</h1>
                <div class="um-subtitle">
                    Hiện có <span th:text="${matchPage.totalElements}" class="text-white"></span> trận đấu sắp tới
                </div>
            </div>
        </div>

        <div class="info-box">
            <div th:each="m : ${matchPage.content}" class="match-row" th:data-url="@{'/match-detail/' + ${m.id}}" onclick="window.location.href=this.getAttribute('data-url')">
                
                <div class="m-date" th:text="${m.date != null ? #temporals.format(m.date, 'dd/MM/yyyy HH:mm') : 'Chưa xếp lịch'}"></div>
                
                <div class="m-main-col">
                    <a th:href="@{'/profile/' + ${m.player1.username}}" class="m-player-name left" onclick="event.stopPropagation()" th:text="${m.player1.username}"></a>
                    
                    <div class="score-box">
                        <div class="score-main-row">
                            <div class="m-avatar">
                                <img th:if="${m.player1.avatar != null}" th:src="@{'/uploads/avatars/' + ${m.player1.avatar}}">
                                <i th:if="${m.player1.avatar == null}" class="fas fa-user"></i>
                            </div>
                            
                            <span class="vs-badge">vs</span>
                            
                            <div class="m-avatar">
                                <img th:if="${m.player2.avatar != null}" th:src="@{'/uploads/avatars/' + ${m.player2.avatar}}">
                                <i th:if="${m.player2.avatar == null}" class="fas fa-user"></i>
                            </div>
                        </div>
                    </div>
                    
                    <a th:href="@{'/profile/' + ${m.player2.username}}" class="m-player-name right" onclick="event.stopPropagation()" th:text="${m.player2.username}"></a>
                </div>

                <div class="m-tour-col">
                    <i th:if="${m.tournament == null}" class="fas fa-handshake me-1" style="color: #0dcaf0;"></i>
                    <i th:if="${m.tournament != null}" class="fas fa-trophy me-1" style="color: #ffc107;"></i>
                    <span th:text="${m.tournament != null ? m.tournament.name : 'Giao hữu'}"></span>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(matchPage.content)}" style="text-align: center; padding: 60px 20px; color: #666;">
                <i class="fas fa-calendar-times" style="font-size: 3rem; margin-bottom: 15px; opacity: 0.5;"></i>
                <p>Chưa có lịch thi đấu nào sắp diễn ra.</p>
            </div>
        </div>

        <div th:if="${matchPage.totalPages > 1}" class="pagination-container">
            <ul class="pagination">
                <li class="page-item" th:classappend="${matchPage.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/upcoming-matches(page=${matchPage.number - 1})}">
                        <i class="fas fa-chevron-left"></i>
                    </a>
                </li>
                
                <li class="page-item" th:each="i : ${#numbers.sequence(0, matchPage.totalPages - 1)}" 
                    th:classappend="${matchPage.number == i} ? 'active'"
                    th:if="${i >= matchPage.number - 2 and i <= matchPage.number + 2}">
                    <a class="page-link" th:href="@{/upcoming-matches(page=${i})}" th:text="${i + 1}"></a>
                </li>
                
                <li class="page-item" th:classappend="${matchPage.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/upcoming-matches(page=${matchPage.number + 1})}">
                        <i class="fas fa-chevron-right"></i>
                    </a>
                </li>
            </ul>
        </div>

    </div>

    <th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
