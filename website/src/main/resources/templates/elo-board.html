<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/header :: head}"></th:block>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif !important; background-color: #000000; color: #ffffff; margin: 0; }
        .wide-container { max-width: 1400px !important; margin: 0 auto; padding: 0 20px; }

        /* Stats Row */
        .stats-row { display: flex; background-color: #1a1a1a; border-radius: 12px; border: 1px solid #2d2d2d; margin-bottom: 25px; overflow: hidden; }
        .stat-card { flex: 1; padding: 20px 10px; text-align: center; border-right: 1px solid #2d2d2d; transition: background 0.3s; }
        .stat-card:hover { background-color: #222; }
        .stat-card:last-child { border-right: none; }
        .stat-card .player-avatar { font-size: 1.8rem; margin-bottom: 8px; display: block; }
        .stat-card .stat-name { font-weight: 800; font-size: 1.1rem; color: #fff; text-transform: uppercase; display: block; margin-bottom: 2px; transition: color 0.2s ease; }
        .stat-card .stat-name:hover { color: #ffc107 !important; }
        .stat-card .stat-label { font-size: 0.75rem; color: #888; margin-bottom: 8px; }
        .stat-card .stat-value { font-size: 1.8rem; font-weight: 900; line-height: 1; }

        /* Bảng Xếp Hạng */
        .fotmob-card { background-color: #1a1a1a !important; border-radius: 12px; border: 1px solid #2d2d2d; overflow: hidden; }
        .table-custom { margin-bottom: 0; background-color: transparent !important; color: #fff; }
        
        /* ĐỒNG BỘ MÀU NỀN THEAD GIỐNG TRANG HOME */
        .table-custom th { 
            background-color: rgba(255, 255, 255, 0.1) !important; 
            color: #888; 
            font-size: 0.7rem; 
            text-transform: uppercase; 
            padding: 15px; 
            border-bottom: 1px solid #2d2d2d !important; 
        }
        
        .table-custom td { border-bottom: 1px solid #2d2d2d !important; padding: 12px 15px; background: transparent !important; color: #fff; }
        .table-custom tr:hover td { background-color: #222222 !important; cursor: pointer; }
        
        /* HIỆU ỨNG HOVER TÊN NGƯỜI CHƠI */
        .table-player-name { transition: color 0.2s ease; }
        .table-player-name:hover { color: #ffc107 !important; }

        /* Rank column */
        .rank-col { width: 80px; text-align: center; }
        .rank-main { font-size: 1.4rem; font-weight: 900; display: block; line-height: 1; }
        .top-1 { color: #ffc107 !important; }
        
        /* FIFA Result circles */
        .fifa-form { display: flex; gap: 5px; }
        .fifa-circle { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 900; color: #fff; border: 2px solid rgba(255,255,255,0.1); }
        .c-w { background-color: #008a4b; } .c-d { background-color: #6d7278; } .c-l { background-color: #d0021b; }

        /* Last Result box */
        .last-res-box { display: flex; align-items: center; font-size: 0.85rem; line-height: 1; border-left: 1px solid #333; padding-left: 15px; width: 170px; }
        .team-names { text-align: left; font-weight: 500; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .score-capsule { background: #2a2a2a; border-radius: 4px; padding: 4px 8px; font-weight: 900; color: #fff; min-width: 32px; text-align: center; display: flex; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>
    <div th:replace="~{fragments/header :: navbar}"></div>

    <div class="wide-container mt-4 mb-5">
        
        <!-- STATS ROW -->
        <div class="stats-row" th:if="${not #lists.isEmpty(playerStats)}">
            <div class="stat-card">
                <i class="fas fa-medal player-avatar" style="color: #ffc107;"></i>
                <a th:href="@{'/profile/' + ${sort == 'asc' ? playerStats[playerStats.size()-1].player.username : playerStats[0].player.username}}" 
                   class="stat-name text-decoration-none" 
                   th:text="${sort == 'asc' ? playerStats[playerStats.size()-1].player.username : playerStats[0].player.username}"></a>
                <div class="stat-label">Cao nhất</div>
                <div class="stat-value" style="color: #ffc107;">1st</div>
            </div>

            <div class="stat-card">
                <i class="fas fa-anchor player-avatar" style="color: #666;"></i>
                <a th:href="@{'/profile/' + ${sort == 'asc' ? playerStats[0].player.username : playerStats[playerStats.size()-1].player.username}}" 
                   class="stat-name text-decoration-none" 
                   th:text="${sort == 'asc' ? playerStats[0].player.username : playerStats[playerStats.size()-1].player.username}"></a>
                <div class="stat-label">Thấp nhất</div>
                <div class="stat-value" style="color: #666;" th:text="${playerStats.size() + 'th'}">--th</div>
            </div>

            <div class="stat-card">
                <i class="fas fa-rocket player-avatar" style="color: #00ff85;"></i>
                <a th:if="${bestGrower != null}" th:href="@{'/profile/' + ${bestGrower.username}}" class="stat-name text-decoration-none" th:text="${bestGrower.username}"></a>
                <span th:if="${bestGrower == null}" class="stat-name">---</span>
                <div class="stat-label">Phong độ rực sáng</div>
                <div class="stat-value" style="color: #00ff85;">
                    <i class="fas fa-caret-up"></i> <span th:text="${maxGrowth}">0</span>
                </div>
            </div>

            <div class="stat-card">
                <i class="fas fa-arrow-trend-down player-avatar" style="color: #ff004e;"></i>
                <a th:if="${worstGrower != null}" th:href="@{'/profile/' + ${worstGrower.username}}" class="stat-name text-decoration-none" th:text="${worstGrower.username}"></a>
                <span th:if="${worstGrower == null}" class="stat-name">---</span>
                <div class="stat-label">Phong độ chạm đáy</div>
                <div class="stat-value" style="color: #ff004e;">
                    <i class="fas fa-caret-down"></i> <span th:text="${minGrowth}">0</span>
                </div>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h3 class="fw-bold m-0 text-uppercase">Bảng xếp hạng chi tiết</h3>
            <div class="d-flex gap-2">
                <a th:href="@{/elo-board(sort='desc')}" class="btn btn-sm btn-outline-warning rounded-pill px-3 fw-bold" th:classappend="${sort == 'asc' ? '' : 'active'}">CAO ĐẾN THẤP</a>
                <a th:href="@{/elo-board(sort='asc')}" class="btn btn-sm btn-outline-warning rounded-pill px-3 fw-bold" th:classappend="${sort == 'asc' ? 'active' : ''}">THẤP ĐẾN CAO</a>
            </div>
        </div>

        <div class="fotmob-card">
            <div class="table-responsive" style="border: none;">
                <table class="table table-custom m-0">
                    <thead>
                        <tr>
                            <th class="rank-col">Rank</th>
                            <th>Người chơi</th>
                            <th>Phong độ</th>
                            <th>Kết quả gần nhất</th>
                            <th class="text-center">Kết quả gần nhất +/-</th>
                            <th class="text-end">Elo</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="stat, iterStat : ${playerStats}"
                            th:data-url="@{'/profile/' + ${stat.player.username}}" 
                            onclick="window.location.href=this.getAttribute('data-url')">
                            <td class="rank-col align-middle">
                                <span class="rank-main" th:classappend="${sort != 'asc' and iterStat.count == 1 ? 'top-1' : ''}" th:text="${iterStat.count}"></span>
                            </td>

                            <td class="align-middle">
                                <div class="d-flex align-items-center">
                                    
                                    <!-- 1. NẾU CÓ ẢNH TẢI LÊN -->
                                    <img th:if="${stat.player.avatar != null}" 
                                         th:src="@{'/uploads/avatars/' + ${stat.player.avatar}}" 
                                         class="rounded-circle me-3 shadow-sm" 
                                         style="width: 35px; height: 35px; object-fit: cover; border: 1px solid #444;" 
                                         alt="Avatar">
                                         
                                    <!-- 2. NẾU CHƯA CÓ ẢNH (Khung tròn đen tuyền) -->
                                    <div th:if="${stat.player.avatar == null}" 
                                         class="rounded-circle me-3 d-flex align-items-center justify-content-center shadow-sm" 
                                         style="width: 35px; height: 35px; background-color: #000; border: 1px solid #444;">
                                         <i class="fas fa-user text-secondary" style="font-size: 0.9rem;"></i>
                                    </div>

                                    <!-- Tên người chơi có hiệu ứng table-player-name -->
                                    <a th:href="@{'/profile/' + ${stat.player.username}}" class="text-white fw-bold text-decoration-none fs-5 table-player-name" th:text="${stat.player.username}"></a>
                                    <i th:if="${stat.player.role == 'ADMIN'}" class="fas fa-check-circle text-info ms-2" title="Admin"></i>
                                </div>
                            </td>

                            <td class="align-middle">
                                <div class="fifa-form">
                                    <th:block th:if="${stat['form'] != null}" th:each="f : ${stat['form']}">
                                        <div class="fifa-circle" th:classappend="${f == 'W' ? 'c-w' : (f == 'L' ? 'c-l' : 'c-d')}" th:text="${f}"></div>
                                    </th:block>
                                </div>
                            </td>

                            <td class="align-middle">
                                <div class="last-res-box" th:if="${stat['p1Name'] != null}">
                                    <div class="team-names">
                                        <div class="text-white" th:text="${stat['p1Name']}"></div>
                                        <div class="text-white" th:text="${stat['p2Name']}"></div>
                                    </div>
                                    <div class="score-capsule">
                                        <div th:text="${stat['p1Score']}"></div>
                                        <div th:text="${stat['p2Score']}"></div>
                                    </div>
                                </div>
                                <span th:if="${stat['p1Name'] == null}" class="text-muted small ps-3 fst-italic">Chưa thi đấu</span>
                            </td>

                            <td class="text-center align-middle">
                                <div th:if="${stat['p1Name'] != null and stat['lastResult'] != null}" class="d-flex align-items-center justify-content-center">
                                    <div class="fifa-circle" 
                                         th:classappend="${stat['lastResult'] == 'W' ? 'c-w' : (stat['lastResult'] == 'L' ? 'c-l' : 'c-d')}" 
                                         th:text="${stat['lastResult']}">
                                    </div>
                                    <span class="fw-bold ms-2" style="font-size: 0.95rem;" 
                                          th:text="${stat['lastDiff'] != null and stat['lastDiff'] > 0 ? '+' + stat['lastDiff'] : (stat['lastDiff'] != null ? stat['lastDiff'] : '0')}">
                                    </span>
                                </div>
                                <span th:if="${stat['p1Name'] == null or stat['lastResult'] == null}" class="text-muted">-</span>
                            </td>

                            <td class="text-end align-middle">
                                <span class="fs-4 fw-bold text-white" th:text="${stat.player.elo}"></span>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <th:block th:replace="~{fragments/header :: scripts}"></th:block>
</body>
</html>
