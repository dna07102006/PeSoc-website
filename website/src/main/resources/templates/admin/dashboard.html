<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Admin Dashboard - PESOC</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">PESOC ADMIN</span>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Đăng xuất</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>Chào mừng quay trở lại, Admin!</h2>
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card bg-primary text-white mb-3">
                    <div class="card-body">
                        <h5>Quản lý giải đấu</h5>
                        <p>Thêm, sửa, xóa các giải bóng đá.</p>
                        <a href="#" class="btn btn-light btn-sm">Vào quản lý</a>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white mb-3">
                    <div class="card-body">
                        <h5>Lên lịch đấu</h5>
                        <p>Sắp xếp cặp đấu và thời gian.</p>
                        <a href="#" class="btn btn-light btn-sm">Vào quản lý</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
