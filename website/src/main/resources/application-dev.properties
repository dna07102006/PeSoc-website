# 1. Cấu hình H2 đọc data từ file đã lưu (Giữ nguyên chế độ nhái MySQL)
# LƯU Ý: Đã XÓA lệnh tắt khóa ngoại (REFERENTIAL_INTEGRITY FALSE) để app chạy chuẩn logic
spring.datasource.url=jdbc:h2:file:./h2data/pesoc_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 2. Hibernate tự động cập nhật bảng nếu sếp viết thêm code mới (Không làm mất data)
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# (ĐÃ XÓA toàn bộ các dòng spring.sql.init... vì data đã vào nhà an toàn rồi)